name: Deploy Solvix Docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node (Node 20 recommended for Tailwind v4)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: "npm"

      # Install the exact dependency tree committed to package-lock.json.
      - name: Install dependencies
        run: npm ci --include=optional

      # Rebuild native modules explicitly (extra safety for Tailwind v4)
      - name: Rebuild native modules
        run: npm rebuild

      # Build project
      - name: Build project
        run: npm run build

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
